# Стартовый конфиг структуры Discord-сервера РНБ
# Используется cogs/provisioning.py (Фаза 1). Дополняй по мере необходимости.
#
# ВАЖНО: Discord-роли не переводятся под каждого пользователя отдельно — у роли
# одно имя. Поэтому имена ролей ниже двуязычные ("RU | EN"), тот же принцип,
# что и для двуязычных названий каналов (например "правила-verification").
# restricted_to в секции channels должен ТОЧНО совпадать со строкой name в
# секции roles.
#
# Роли отрядов (Штурм/Логистика/Разведка/Транспорт/Поддержка) — не привязаны
# ни к одному статичному каналу. Они нужны как метка специализации участника
# и для пинга: /start-op (bot/cogs/ops.py) упоминает роль выбранного отряда
# в анонсе операции.
#
# Про имена КАНАЛОВ (не категорий): Discord сам нормализует имя канала при
# создании (нижний регистр, пробелы → дефисы). cogs/_shared.py:
# normalize_channel_name() делает то же самое перед созданием/сравнением —
# писать имя канала в конфиге уже в "дефисном" виде вручную не обязательно,
# но и не вредно (нормализация идемпотентна). У категорий (categories[].name)
# такой нормализации на стороне Discord нет — пробелы и регистр там ок как
# есть.

roles:
  - name: "Верховный Главнокомандующий | Supreme Commander"
    color: "#e74c3c"
    hoist: true
    permissions: ["administrator"]  # реальные права Discord, не только доступ к командам бота
  - name: "Глава отряда | Squad Lead"
    color: "#e67e22"
    hoist: true
  - name: "Офицер | Officer"
    color: "#f1c40f"
    hoist: true
  - name: "Боец | Trooper"
    color: "#3498db"
    hoist: true  # чтобы рядовой состав был отдельной группой в панели участников справа
  - name: "Новобранец | Recruit"
    color: "#95a5a6"
    hoist: false
  - name: "Штурм | Assault"
    color: "#c0392b"
    hoist: false
  - name: "Логистика | Logistics"
    color: "#16a085"
    hoist: false
  - name: "Разведка | Recon"
    color: "#8e44ad"
    hoist: false
  - name: "Транспорт | Transport"
    color: "#2980b9"
    hoist: false
  - name: "Поддержка | Support"
    color: "#27ae60"
    hoist: false
  - name: "🎮 Готов играть сейчас"
    color: "#43b581"
    hoist: false
    mentionable: true  # чтобы Боец+ мог пинговать её в сбор-на-операцию под внеплановый созвон

categories:
  - name: "📜 ПРИВЕТСТВИЕ"
    # Единственная категория, открытая @everyone — это "передняя дверь"
    # сервера. Всё остальное закрыто до выбора отряда (см. restricted_to
    # ниже) — /post-onboarding и кнопки отряда это и открывают.
    channels:
      - {name: "правила-verification", type: text}
  - name: "📢 ШТАБ / HQ"
    restricted_to: &member_roles
      - "Штурм | Assault"
      - "Логистика | Logistics"
      - "Разведка | Recon"
      - "Транспорт | Transport"
      - "Поддержка | Support"
      - "Боец | Trooper"
      - "Глава отряда | Squad Lead"
      - "Офицер | Officer"
      - "Верховный Главнокомандующий | Supreme Commander"
    channels:
      - {name: "объявления-announcements", type: text, restricted_to: ["Офицер | Officer", "Глава отряда | Squad Lead", "Верховный Главнокомандующий | Supreme Commander"]}
      - {name: "💬-болталка-chat", type: text}
  - name: "🎯 ОПЕРАЦИИ / OPERATIONS"
    restricted_to: *member_roles
    channels:
      - {name: "сбор-на-операцию", type: text}
      - {name: "карта-и-счёт", type: text, restricted_to: ["Глава отряда | Squad Lead", "Офицер | Officer", "Верховный Главнокомандующий | Supreme Commander"]}
  - name: "🎯 АКТИВНЫЕ ОПЕРАЦИИ"
    dynamic: true  # содержимое управляется /start-op, /sync-server никогда не трогает каналы внутри
    restricted_to: *member_roles
    channels: []  # временные пары текст+голос создаёт /start-op (bot/cogs/ops.py)
  - name: "🎬 КОНТЕНТ / CONTENT"
    restricted_to: *member_roles
    channels:
      - {name: "хайлайты-highlights", type: forum}
      - {name: "ютуб-канал-youtube", type: text}
      - {name: "тактика-обсуждение", type: forum}
  - name: "🛠 ТЕХНИЧЕСКОЕ / TECH"
    restricted_to: *member_roles
    channels:
      - {name: "обратная-связь", type: text}
  - name: "🔒 ШТАБ ОФИЦЕРОВ"
    # Уже, чем member_roles — категория видна только офицерскому уровню,
    # не всем участникам с отрядом/рангом. Каналы внутри и так были
    # ограничены тем же списком индивидуально — теперь категория с ними
    # согласована, а не открыта всем по умолчанию.
    restricted_to: ["Офицер | Officer", "Глава отряда | Squad Lead", "Верховный Главнокомандующий | Supreme Commander"]
    channels:
      - {name: "офицерский-стол", type: text, restricted_to: ["Офицер | Officer", "Глава отряда | Squad Lead", "Верховный Главнокомандующий | Supreme Commander"]}
      - {name: "модерация", type: text, restricted_to: ["Офицер | Officer", "Глава отряда | Squad Lead", "Верховный Главнокомандующий | Supreme Commander"]}

translate:
  mirror_pairs_enabled: false
  mirror_pairs: []  # заполнить после Фазы 1: [{ru_channel: "объявления-announcements", en_channel: "..."}]

report:
  source: manual  # переключить на "rcon", когда появится проверенный инструмент
  channel: "карта-и-счёт"

ops:
  announce_channel: "сбор-на-операцию"
  temp_category: "🎯 АКТИВНЫЕ ОПЕРАЦИИ"
  cleanup_delay_seconds: 300

sync:
  # /sync-server необратимо удаляет роли/каналы, которых нет в этом файле.
  # Доступ уже, чем у /report и /start-op (Squad Lead+) — только Officer+.
  allowed_roles: ["Офицер | Officer", "Верховный Главнокомандующий | Supreme Commander"]
